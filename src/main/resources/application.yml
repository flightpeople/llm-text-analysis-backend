server:
  port: 8080

spring:
  application:
    name: llm-text-analysis

llm:
  api:
    # 智谱 GLM 免费模型（OpenAI 兼容接口），也可换成 DeepSeek 等
    base-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    # 从环境变量读取，避免密钥硬编码
    key: ${LLM_API_KEY:}
    model: glm-4-flash
    connect-timeout-ms: 5000
    response-timeout-ms: 60000
  circuit-breaker:
    # 连续失败5次打开熔断
    failure-threshold: 5
    # 熔断30秒后进入半开试探
    open-duration-seconds: 30
  cache:
    maximum-size: 10000
    expire-after-write-hours: 1
